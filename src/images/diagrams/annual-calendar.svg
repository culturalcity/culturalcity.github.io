<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 752" width="800" height="752" role="img" aria-labelledby="cal-title cal-desc" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <title id="cal-title">閱大安年度循環行事曆</title>
  <desc id="cal-desc">以月份為列、六類工作為欄的年度行事曆。治理與會議：3 至 4 月區權會前置作業（任期年）、5 月召開區權會、6 月底換屆交接（任期年）、10 月年度預算與工作計畫準備。物業換約：9 月討論續約或招標、10 月如招標則刊登、11 月月初書審月中簡報月底決定續約對象、12 月合約用印、1 月合約存查。其他合約與保險：10 月園藝與 AED 議價，合約到期年另有電梯、機電、大門；11 月公共意外險與火險比價、垃圾整月秤重；12 月保險續保完成、垃圾清運議價。定期保養：2 月與 8 月 UPS 電池放電；物業附帶的水塔清洗、環境消毒、高壓沖洗上半年與下半年各一次，日期依物業排程；12 月公設冷氣保養清洗。法規與安全：公共安全檢查每 3 年一次，1 月議價、2 月執行；2 月消防安全設備檢修申報；4 月流出抑制設施維護文件上傳；6 月防颱與高溫準備；7 至 8 月防空演習（依市府公告）；10 至 11 月大公電契約容量檢討。節慶公告：1 月聖誕布置撤除、2 月春節安排（值勤輪班、禁止裝修）、7 至 8 月中元普渡籌備（依農曆）、12 月聖誕布置與跨年注意事項、頂樓煙火維安。每月固定追蹤台電四張帳單並更新氣候行動獎明細，月底前兩天排好下個月的清潔與保養日曆。</desc>
