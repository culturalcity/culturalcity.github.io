<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 762" width="720" height="762" role="img" aria-labelledby="eq-title eq-desc" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif">
  <title id="eq-title">閱大安關鍵設備與鑰匙位置</title>
  <desc id="eq-desc">大樓剖面示意，由上而下列出各樓層的關鍵設備：R3F 電梯機房；R2F 水錶室與頂樓水塔；2F 儲藏室文件櫃存放竣工圖紙本；1F 管理中心櫃檯有火警受信總機，櫃檯後方有監控主機（4 台、55 支攝影機），櫃檯後方櫃有中央監控、瓦斯緊急遮斷、緊急廣播與鑰匙盒，文具箱資料袋有另一組鑰匙，另有電錶室，包裹室鐵架第三格放防水閘門固定螺絲，颱風時防水閘門裝在前門與後門；B1 配電室（限廠商進入）與電錶走廊（防水閘門平時存放處）；B2 發電機房；B4 消防機房（防颱沙包）與水箱內兩台沉水式揚水馬達。總電源開關與給水總閥位置待確認。</desc>
  <rect width="720" height="762" fill="#f5f5f5"/>
  <text x="40" y="40" fill="#2d3142" font-size="20" font-weight="700">關鍵設備與鑰匙位置</text>
  <text x="40" y="64" fill="#2d3142" font-size="12">大樓剖面示意（非比例），只列總幹事 Wiki 有記載的設備；灰底空白層不代表沒有設備。</text>
  <line x1="160" y1="126" x2="696" y2="126" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="168" x2="696" y2="168" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="208" x2="696" y2="208" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="240" x2="696" y2="240" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="282" x2="696" y2="282" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="456" x2="696" y2="456" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="520" x2="696" y2="520" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="562" x2="696" y2="562" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="602" x2="696" y2="602" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="160" y1="666" x2="696" y2="666" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="40" y="84" width="120" height="42" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="111.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">R3F</text>
  <text x="202" y="109.0" fill="#2d3142" font-size="12">電梯機房</text>
  <rect x="40" y="126" width="120" height="42" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="153.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">R2F</text>
  <text x="202" y="151.0" fill="#2d3142" font-size="12">水錶室・頂樓水塔</text>
  <rect x="40" y="168" width="120" height="40" fill="#e9e9e9" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="194.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">RF</text>
  <rect x="40" y="208" width="120" height="32" fill="#e9e9e9" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="230.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">3F–15F</text>
  <rect x="40" y="240" width="120" height="42" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="267.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">2F</text>
  <text x="202" y="265.0" fill="#2d3142" font-size="12">儲藏室文件櫃：竣工圖紙本</text>
  <rect x="40" y="282" width="120" height="174" fill="rgba(235,108,54,0.08)" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="375.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">1F</text>
  <circle cx="190" cy="303.0" r="4" fill="#eb6c36"/>
  <text x="202" y="307.0" fill="#2d3142" font-size="12">管理中心櫃檯：火警受信總機</text>
  <circle cx="190" cy="325.0" r="4" fill="#eb6c36"/>
  <text x="202" y="329.0" fill="#2d3142" font-size="12">櫃檯後方：監控主機（NVR×4，共 55 支攝影機）</text>
  <circle cx="190" cy="347.0" r="4" fill="#eb6c36"/>
  <text x="202" y="351.0" fill="#2d3142" font-size="12">櫃檯後方櫃：中央監控・瓦斯緊急遮斷・緊急廣播・鑰匙盒</text>
  <text x="202" y="373.0" fill="#2d3142" font-size="12">文具箱資料袋：另一組鑰匙（清冊在 Notion「財產清冊」）</text>
  <text x="202" y="395.0" fill="#2d3142" font-size="12">電錶室</text>
  <text x="202" y="417.0" fill="#2d3142" font-size="12">包裹室鐵架第三格：防水閘門固定螺絲零件</text>
  <circle cx="190" cy="435.0" r="4" fill="#eb6c36"/>
  <text x="202" y="439.0" fill="#eb6c36" font-size="12" font-weight="700">颱風時：防水閘門裝在前門、後門</text>
  <rect x="40" y="456" width="120" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="494.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">B1</text>
  <text x="202" y="481.0" fill="#2d3142" font-size="12">配電室（限廠商進入）</text>
  <circle cx="190" cy="499.0" r="4" fill="#eb6c36"/>
  <text x="202" y="503.0" fill="#2d3142" font-size="12">電錶走廊：防水閘門平時存放處</text>
  <rect x="40" y="520" width="120" height="42" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="547.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">B2</text>
  <circle cx="190" cy="541.0" r="4" fill="#eb6c36"/>
  <text x="202" y="545.0" fill="#2d3142" font-size="12">發電機房：緊急發電機</text>
  <rect x="40" y="562" width="120" height="40" fill="#e9e9e9" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="588.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">B3</text>
  <rect x="40" y="602" width="120" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="100" y="640.0" fill="#2d3142" font-size="16" font-weight="700" text-anchor="middle">B4</text>
  <circle cx="190" cy="623.0" r="4" fill="#eb6c36"/>
  <text x="202" y="627.0" fill="#2d3142" font-size="12">消防機房：防颱沙包平時收在這裡</text>
  <circle cx="190" cy="645.0" r="4" fill="#eb6c36"/>
  <text x="202" y="649.0" fill="#2d3142" font-size="12">水箱：揚水馬達（沉水式×2）</text>
  <line x1="24" y1="456" x2="696" y2="456" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="696" y="450" fill="#4f5d75" font-size="12" text-anchor="end">地面</text>
  <circle cx="46" cy="684" r="4" fill="#eb6c36"/>
  <text x="58" y="688" fill="#2d3142" font-size="12">橘點＝停電、漏水、火警、颱風時要先找到的東西</text>
  <rect x="40" y="702" width="656" height="32" rx="4" fill="#ffffff" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="56" y="723" fill="#2d3142" font-size="12">待確認：總電源開關、給水總閥的位置。確認後補進本圖。</text>
</svg>
